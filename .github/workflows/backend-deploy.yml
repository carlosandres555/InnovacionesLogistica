name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test --if-present
        continue-on-error: true

      - name: Deploy to EC2 via SSM
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_INSTANCE_ID: i-02a5cb6ddd9604891
        run: |
          echo "📤 Sending deployment command to EC2 via AWS Systems Manager..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "cd /opt/innovaciones-logistica",
              "git checkout -- . 2>/dev/null || true",
              "GIT_SSH_COMMAND=\"ssh -i ~/.ssh/github_key\" git pull origin main",
              "cd backend",
              "npm install",
              "npx prisma generate",
              "npx prisma db push --skip-generate",
              "pm2 restart innovaciones-api --update-env",
              "pm2 logs innovaciones-api --lines 20"
            ]' \
            --region us-east-1 \
            --output text \
            --query 'Command.CommandId')

          echo "✅ Command sent (ID: $COMMAND_ID)"
          echo "⏳ Waiting for command completion..."

          # Wait for command to complete with timeout (max 10 minutes)
          TIMEOUT=120
          ELAPSED=0

          while [ $ELAPSED -lt $TIMEOUT ]; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $EC2_INSTANCE_ID \
              --region us-east-1 \
              --query 'Status' \
              --output text 2>/dev/null || echo "Unknown")

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment successful!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $EC2_INSTANCE_ID \
                --region us-east-1 \
                --query 'StandardOutputContent' \
                --output text
              exit 0
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed (Status: $STATUS)"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $EC2_INSTANCE_ID \
                --region us-east-1 \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            echo "  [$ELAPSED/$TIMEOUT] Status: $STATUS"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done

          echo "❌ Deployment timeout (>10 minutes)"
          exit 1

