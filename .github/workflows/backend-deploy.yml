name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test --if-present
        continue-on-error: true

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY_BASE64: ${{ secrets.EC2_KEY_BASE64 }}
        run: |
          set -x
          mkdir -p ~/.ssh
          echo "$EC2_KEY_BASE64" | base64 -d > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "SSH key created"
          ssh-keyscan -H $EC2_HOST >> ~/.ssh/known_hosts
          echo "SSH known_hosts updated"

          ssh -v $EC2_USER@$EC2_HOST << 'ENDSSH'
          set -x
          cd /opt/innovaciones-logistica
          echo "Pulling latest code..."
          git pull origin main || echo "Git pull failed"
          cd backend
          echo "Installing dependencies..."
          npm install
          echo "Generating Prisma..."
          npx prisma generate
          echo "Pushing database..."
          npx prisma db push --skip-generate
          echo "Restarting PM2..."
          pm2 restart innovaciones-api
          echo "Showing logs..."
          pm2 logs innovaciones-api --lines 20
          ENDSSH
          echo "Deployment completed"

