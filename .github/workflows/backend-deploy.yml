name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test --if-present
        continue-on-error: true

      - name: Deploy to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_KEY: ${{ secrets.EC2_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$EC2_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          # Use aggressive SSH options to bypass connectivity issues
          ssh -o BatchMode=yes \
              -o ConnectTimeout=60 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              -o ServerAliveInterval=10 \
              -o ServerAliveCountMax=10 \
              -o ProxyUseFdpass=no \
              $EC2_USER@$EC2_HOST 'bash -s' << 'ENDSSH'
          set -x
          cd /opt/innovaciones-logistica
          git pull origin main || echo "Git pull failed"
          cd backend
          npm install
          npx prisma generate
          npx prisma db push --skip-generate
          pm2 restart innovaciones-api
          sleep 2
          pm2 logs innovaciones-api --lines 20
          ENDSSH

