name: Deploy Backend to EC2

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - '.github/workflows/backend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      - name: Install dependencies
        run: |
          cd backend
          npm ci

      - name: Run tests
        run: |
          cd backend
          npm run test --if-present
        continue-on-error: true

      - name: Deploy to EC2 via SSM
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          EC2_INSTANCE_ID: i-02a5cb6ddd9604891
        run: |
          # Create deployment script
          DEPLOY_SCRIPT='
          set -e
          cd /opt/innovaciones-logistica
          echo "🧹 Discarding local changes..."
          git checkout -- . 2>/dev/null || true
          echo "📦 Pulling latest code..."
          GIT_SSH_COMMAND="ssh -i ~/.ssh/github_key" git pull origin main
          cd backend
          echo "📚 Installing dependencies..."
          npm install
          echo "🔧 Generating Prisma..."
          npx prisma generate
          echo "💾 Pushing database migrations..."
          npx prisma db push --skip-generate
          echo "🔄 Restarting PM2..."
          pm2 restart innovaciones-api --update-env
          echo "✅ Deployment completed"
          pm2 logs innovaciones-api --lines 20
          '

          # Execute via SSM
          echo "📤 Sending deployment command to EC2 via AWS Systems Manager..."
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids $EC2_INSTANCE_ID \
            --document-name "AWS-RunShellScript" \
            --parameters commands="$DEPLOY_SCRIPT" \
            --output text \
            --query 'Command.CommandId')

          echo "⏳ Waiting for command completion (ID: $COMMAND_ID)..."

          # Wait for command to complete
          while true; do
            STATUS=$(aws ssm get-command-invocation \
              --command-id $COMMAND_ID \
              --instance-id $EC2_INSTANCE_ID \
              --query 'Status' \
              --output text)

            if [ "$STATUS" = "Success" ]; then
              echo "✅ Deployment successful!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $EC2_INSTANCE_ID \
                --query 'StandardOutputContent' \
                --output text
              break
            elif [ "$STATUS" = "Failed" ] || [ "$STATUS" = "Cancelled" ]; then
              echo "❌ Deployment failed!"
              aws ssm get-command-invocation \
                --command-id $COMMAND_ID \
                --instance-id $EC2_INSTANCE_ID \
                --query 'StandardErrorContent' \
                --output text
              exit 1
            fi

            echo "  Status: $STATUS"
            sleep 5
          done

